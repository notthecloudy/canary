[workspace]
resolver = "2"
members = [
    "crates/canary-core",
    "crates/canary-ir",
    "crates/canary-loader",
    "crates/canary-arch",
    "crates/canary-arch-x86",
    "crates/canary-analysis",
    "crates/canary-emit",
    "crates/canary-plugin-api",
    "crates/canary-cli", "crates/canary-sdb", "crates/canary-typerecov", "crates/canary-cpprecov",
    "crates/canary-constraints",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Canary Contributors"]
license = "Apache-2.0"
repository = "https://github.com/notthecloudy/canary"
homepage = "https://canary.dev"
documentation = "https://docs.canary.dev"
rust-version = "1.78"

[workspace.dependencies]
indexmap = { version = "2.1", features = ["serde"] }
smallvec = "1"
rustc-hash = "2"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Binary parsing
goblin = "0.8"
object = "0.36"
windows-metadata = "0.60.0"

# Disassembly
capstone = "0.12"

# Error handling
thiserror = "2"
anyhow = "1"

# Logging / tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# CLI
clap = { version = "4", features = ["derive", "color"] }

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"

[profile.dev]
debug = true

[profile.dev.package."*"]
opt-level = 3   # Optimize dependencies in dev builds for faster iteration
