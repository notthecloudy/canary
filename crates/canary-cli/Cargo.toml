[package]
name = "canary-cli"
description = "Canary CLI — command-line interface for binary analysis and decompilation"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[[bin]]
name = "canary"
path = "src/main.rs"

[dependencies]
canary-core = { path = "../canary-core" }
canary-ir = { path = "../canary-ir" }
canary-loader = { path = "../canary-loader" }
canary-arch-x86 = { path = "../canary-arch-x86" }
canary-emit = { path = "../canary-emit" }
canary-sdb = { path = "../canary-sdb" }
clap.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
serde_json.workspace = true
serde = { workspace = true, features = ["derive"] }

